syntax = "proto3";
package api;
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Anna-Karenina/sme-engine;apiv1";


service ProjectCrud {
  rpc CreateApp (CreateAppPayload) returns (Project); 
  rpc ReadApp (AppIdPayload) returns (Project);
  rpc UpdateApp (CreateAppPayload) returns (Project);
  rpc RemoveApp (AppIdPayload) returns (AppIdPayload);
  rpc ReadAllApps (EmptyParams) returns (ProjectList);


  rpc SyncAppScripts(AppIdPayload) returns(Project);
  rpc UpdateDefaultRunScript(UpdateDefaultRunScriptParams) returns (Project);
}

service Runners {
  rpc GetAllNodeJsVersions(GetAllNodeJsVersionsParams) returns (NodeJsVersionsInfo);
  rpc DownloadNodeJsVersion(RequestVersion) returns (stream DownloadStatusResponse);
  rpc AbortDownloadNodeJSVersion(EmptyParams) returns (EmptyParams);

  rpc RunApp(RunAppRequest) returns (AppRunTime);
  rpc StopApp(AppIdPayload) returns (AppRunTime);
}

service Environment{ 
  rpc ReadProcessLogs(AppIdPayload) returns (stream ProcessLogsByLine);
  rpc ReadProcessResources(AppIdPayload) returns (stream ResourceUsage);
  rpc RunProjectInCode(AppIdPayload) returns (EmptyParams);
  rpc ProcessesList(EmptyParams) returns (ProcessesListInfoResponse);

  //old
    //rpc ProcessStream(AppIdPayload) returns (stream ProcessInfo);
    // rpc GetNodejsInfo(EmptyParams) returns (NodejsVersionsInfo);
    // rpc UpdateDefaultNodejsVersion(UpdateDefaultNodejsVersionParams) returns (StatusResponse);
}

message EmptyParams {}

message Project { 
  int32 id                = 1;
  string path             = 2;
  string name             = 3;
  repeated string scripts = 4;
  string nodeVersion      = 5;
  string defaultScript    = 6;
  bool isAppValid         = 7;
}


message RequestVersion {
    string version = 1;
  }

message UpdateDefaultNodejsVersionParams {
    int32 id           = 1;
    string version   = 2;
    bool updateNvmrc = 3;
  }

message ProjectList{
  repeated Project projects = 1;
}

message CreateAppPayload { 
  string path = 1;
  string name = 2;
}

message ProcessLogsByLine { 
  string line = 1;
}

message AppIdPayload { 
  int32 id = 1;
}

message Remove {
  string path = 1; 
}

message StatusResponse {
  string status = 1;
}



message RunAppRequest {
  int32 id           = 1;
  string command     = 2;
  string nodeVersion = 3;
}

message AppRunTime {
  int32 id                = 1;
	string status           = 2;
	int32 pid               = 3;
	int32 cpu               = 4;
	int32 mem               = 5;
	int32 sid               = 6;
	repeated int32 ports    = 7;
	string branch           = 8;
}


message TotalEnviromentUsage { 
  string cpu     = 1;
	string mem     = 2;
  int32 quantity = 3;
}

message ProcessInfo {
  TotalEnviromentUsage environment = 1;
  repeated AppRunTime apps         = 2;
}

message UpdateDefaultRunScriptParams {
    string script = 1;
    int32 id      = 2;
}

message DownloadStatusResponse {
  string status = 1;
}

message GetAllNodeJsVersionsParams{
  bool lts_only = 1;
  bool latest_only = 2;
}

message NodeJsVersionInfo{
 bool lts = 1;
 bool installed = 2;
 string version = 3;
}

message NodeJsVersionsInfo{
  repeated NodeJsVersionInfo nodeJsInfo = 1;
}


message ResourceUsage {
  google.protobuf.Timestamp time_stamp = 1;
  float cpu = 2;  
  float mem = 3;  
}

message ProcessesListInfoResponse{ 
  repeated ProcessesListInfo list = 1; 
}

message ProcessesListInfo{
  int32 id = 1;
  int32 pid = 2;
}
