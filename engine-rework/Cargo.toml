[package]
name = "engine-rework"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "0.12.3"
prost = "0.13.5"
tokio = { version = "1.44.1", features = ["full"] }
tokio-stream = "0.1.17"
diesel = { version = "2.1", features = ["sqlite", "r2d2", "chrono"] }
r2d2 = "0.8"
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = {version = "0.4", features = ["serde"]}
regex = "1.11.1"
reqwest = {version = "0.12.15", features = ["json"]}

[build-dependencies]
tonic-build = "0.12.3"
